<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZeroZeta — LiningOps Copilot</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="fx.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --paper: #f5f7f5;
      --ink: #16201a;
      --muted: #5d6b62;
      --line: #d7dfd9;
      --edge: rgba(0, 0, 0, .25);
      --accent: #1f8a4c;
      --accent-soft: #e6f4ec;
      --warn: #b26a00;
      --warn-soft: #fff4e0;
      --bad: #b3261e;
      --bad-soft: #fdeceb;
      --info: #1f5fae;
      --info-soft: #e8f0fb;
      --side: #101713;
      --side-ink: #dfe8e2
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111613;
        --paper: #18201b;
        --ink: #e6ece8;
        --muted: #9aa9a0;
        --line: #2c3831;
        --edge: rgba(255, 255, 255, .25);
        --accent: #4cc27f;
        --accent-soft: #16301f;
        --warn: #f0b050;
        --warn-soft: #33270f;
        --bad: #f08078;
        --bad-soft: #3a1916;
        --info: #7fb0f0;
        --info-soft: #152438;
        --side: #0b0f0d
      }
    }

    :root[data-theme="dark"] {
      --bg: #111613;
      --paper: #18201b;
      --ink: #e6ece8;
      --muted: #9aa9a0;
      --line: #2c3831;
      --edge: rgba(255, 255, 255, .25);
      --accent: #4cc27f;
      --accent-soft: #16301f;
      --warn: #f0b050;
      --warn-soft: #33270f;
      --bad: #f08078;
      --bad-soft: #3a1916;
      --info: #7fb0f0;
      --info-soft: #152438;
      --side: #0b0f0d
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 "Inter Tight", system-ui, sans-serif
    }

    header.top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: var(--side);
      color: var(--side-ink);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
      z-index: 20
    }

    .logo {
      font-weight: 700;
      font-size: 16px;
      white-space: nowrap
    }

    .logo i {
      color: #4cc27f;
      font-style: normal
    }

    #projmeta {
      font-size: 12.5px;
      opacity: .85;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    header select,
    header .tb {
      background: #1e2a23;
      color: var(--side-ink);
      border: 1px solid #33443a;
      border-radius: 6px;
      padding: 5px 8px;
      font: inherit;
      font-size: 12.5px
    }

    header .tb {
      cursor: pointer
    }

    #who {
      font-size: 12px;
      opacity: .8;
      white-space: nowrap
    }

    aside.side {
      position: fixed;
      top: 52px;
      bottom: 0;
      left: 0;
      width: 228px;
      background: var(--side);
      color: var(--side-ink);
      overflow: auto;
      padding: 10px 8px;
      z-index: 10
    }

    aside h5 {
      margin: 14px 8px 6px;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .6
    }

    .st,
    .tool {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: none;
      border: 0;
      color: var(--side-ink);
      text-align: left;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      font: inherit
    }

    .tool.fast {
      margin-top: 6px;
      border: 1px dashed #4cc27f;
      color: #4cc27f;
      font-weight: 600
    }

    .btn.bulk {
      border-color: var(--accent);
      color: var(--accent)
    }

    .st:hover,
    .tool:hover {
      background: #1c2721
    }

    .st.cur,
    .tool.cur {
      background: #1f8a4c;
      color: #fff
    }

    .st .num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid #4cc27f;
      display: grid;
      place-items: center;
      font-size: 12px;
      flex: none
    }

    .st.done .num {
      background: #4cc27f;
      color: #0b0f0d
    }

    .st small {
      display: block;
      font-size: 10.5px;
      opacity: .7
    }

    .st.locked {
      opacity: .45
    }

    .st .lock {
      margin-left: auto;
      font-size: 11px
    }

    main#main {
      margin: 52px 0 0 228px;
      padding: 18px 22px 60px;
      min-height: calc(100vh - 52px);
      transition: margin .2s
    }

    body.chat-open main#main {
      margin-right: 360px
    }

    .phead .kicker,
    .kicker {
      color: var(--accent);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .06em;
      text-transform: uppercase
    }

    .phead h2 {
      margin: 2px 0 12px;
      font-size: 22px
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 0 0 14px;
      min-width: 0
    }

    .card.inner {
      background: var(--bg);
      margin-top: 12px
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 15.5px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .card h4 {
      margin: 6px 0 6px;
      font-size: 14px
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px
    }

    .g-40-60 {
      grid-template-columns: 2fr 3fr
    }

    .g-45-55 {
      grid-template-columns: 9fr 11fr
    }

    .grid2>*,
    .grid3>* {
      min-width: 0
    }

    .grid-side {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 14px
    }

    .sticky {
      position: sticky;
      top: 64px;
      align-self: start
    }

    .guide {
      background: var(--info-soft);
      border-left: 4px solid var(--info);
      padding: 9px 12px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 14px;
      font-size: 13.5px
    }

    .guide b {
      color: var(--info);
      margin-right: 6px
    }

    .btn {
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 13px;
      font: inherit;
      font-weight: 600;
      cursor: pointer
    }

    .btn:hover:not([disabled]) {
      border-color: var(--accent)
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff
    }

    .btn.ghost {
      background: transparent
    }

    .btn[disabled] {
      opacity: .45;
      cursor: not-allowed
    }

    .btn.sm {
      padding: 4px 9px;
      font-size: 12.5px
    }

    .btn.xs {
      padding: 2px 7px;
      font-size: 12px
    }

    .btn.big {
      padding: 12px 22px;
      font-size: 16px
    }

    .btn.full {
      width: 100%;
      margin-top: 8px
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      margin-top: 8px
    }

    .gatebox {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-color: var(--accent)
    }

    .gate {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 12px;
      background: var(--warn-soft);
      color: var(--warn);
      font-weight: 600;
      font-size: 12.5px
    }

    .gate.done {
      background: var(--accent-soft);
      color: var(--accent)
    }

    .tag {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 4px;
      padding: 0 5px;
      white-space: nowrap
    }

    .t-ref {
      background: var(--accent-soft);
      color: var(--accent)
    }

    .t-asm {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .t-mock {
      background: var(--info-soft);
      color: var(--info)
    }

    .t-calc,
    .t-oth {
      background: var(--paper);
      color: var(--muted);
      border: 1px solid var(--line)
    }

    .pill {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 10px;
      padding: 1px 8px
    }

    .pill.ok {
      background: var(--accent-soft);
      color: var(--accent)
    }

    .pill.bad {
      background: var(--bad-soft);
      color: var(--bad)
    }

    .pill.na {
      background: var(--paper);
      color: var(--muted);
      border: 1px solid var(--line)
    }

    .bar {
      display: inline-block;
      width: 70px;
      height: 7px;
      border-radius: 4px;
      background: var(--line);
      vertical-align: middle;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--accent)
    }

    .bar.warnb i {
      background: var(--warn)
    }

    .tw {
      overflow: auto
    }

    .tw.tall {
      max-height: 440px
    }

    table.tbl {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px
    }

    .tbl th,
    .tbl td {
      border-bottom: 1px solid var(--line);
      padding: 5px 7px;
      text-align: left;
      vertical-align: top
    }

    .tbl th {
      position: sticky;
      top: 0;
      background: var(--paper);
      font-size: 12px;
      color: var(--muted)
    }

    .tbl tr.grp td {
      background: var(--accent-soft);
      font-weight: 700;
      color: var(--accent)
    }

    .tbl tr.tot td {
      font-weight: 700;
      border-top: 2px solid var(--line)
    }

    .tbl tr.low {
      background: var(--warn-soft)
    }

    .tbl tr.conf td:first-child {
      box-shadow: inset 3px 0 var(--accent)
    }

    .tbl tr.flag {
      background: var(--bad-soft)
    }

    .tbl tr.ovr {
      background: var(--info-soft)
    }

    .tbl tr.sel {
      outline: 2px solid var(--accent)
    }

    .tbl tr[data-act] {
      cursor: pointer
    }

    input,
    select,
    textarea {
      font: inherit;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 6px
    }

    input.num {
      width: 84px
    }

    input.num.s {
      width: 56px
    }

    input.reason {
      width: 100%;
      margin-top: 4px;
      border-color: var(--warn)
    }

    input.reason.wide {
      min-width: 420px
    }

    .fld {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12.5px;
      color: var(--muted)
    }

    .fld input,
    .fld select {
      color: var(--ink);
      font-size: 14px
    }

    .fld.inline {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      margin: 4px 0
    }

    .form2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .small {
      font-size: 12px;
      color: var(--muted)
    }

    .b {
      font-weight: 700
    }

    .req {
      color: var(--bad)
    }

    .sug {
      color: var(--info)
    }

    .nowrap {
      white-space: nowrap
    }

    .center {
      display: flex;
      justify-content: center
    }

    .drop {
      border: 2px dashed var(--line);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      margin-bottom: 10px
    }

    .note {
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--paper);
      border: 1px solid var(--line);
      font-size: 13px;
      margin: 8px 0
    }

    .note.ok {
      background: var(--accent-soft);
      border-color: transparent
    }

    .note.bad {
      background: var(--bad-soft);
      border-color: transparent
    }

    .checks {
      list-style: none;
      padding: 0;
      margin: 0
    }

    .checks li {
      margin: 4px 0
    }

    .chk {
      white-space: nowrap;
      cursor: pointer
    }

    .svgv,
    .svgp,
    .svgu,
    .svgr {
      width: 100%;
      height: auto;
      display: block
    }

    .svgb {
      width: 48%;
      height: auto;
      display: inline-block
    }

    .svt {
      font: 11px "Inter Tight", sans-serif;
      fill: var(--ink)
    }

    .svt.sm {
      font-size: 9.5px
    }

    .svt.b {
      font-weight: 700
    }

    .svt.muted {
      fill: var(--muted)
    }

    .svt.lab {
      fill: #fff;
      paint-order: stroke;
      stroke: rgba(0, 0, 0, .55);
      stroke-width: 2px
    }

    .zp {
      cursor: pointer
    }

    .zp:hover {
      filter: brightness(1.12)
    }

    .zp.zsel {
      filter: saturate(1.5) brightness(1.15) drop-shadow(0 0 1.5px var(--ink))
    }

    .zp.hl {
      filter: brightness(1.1) saturate(1.2)
    }

    .views {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 10px;
      align-items: start
    }

    .cap {
      font-size: 11.5px;
      color: var(--muted);
      text-align: center;
      margin: 2px 0 8px
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      align-items: center
    }

    .tabs .spacer {
      flex: 1
    }

    .tab {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 5px 12px;
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
      color: var(--ink)
    }

    .tab.on {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent)
    }

    .tabs.big .tab {
      font-size: 13.5px;
      padding: 7px 14px
    }

    .sw {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      vertical-align: middle;
      border: 1px solid var(--edge)
    }

    .splitbar {
      margin: 10px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 13px
    }

    .ze input:not(.num) {
      width: 140px
    }

    ol.rank {
      margin: 0;
      padding-left: 20px
    }

    ol.rank li {
      margin: 5px 0
    }

    .pick {
      cursor: pointer
    }

    .pick.sel {
      outline: 2px solid var(--accent);
      background: var(--accent-soft)
    }

    .pick h4 {
      margin: 0 0 4px
    }

    .recwrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 12px
    }

    .opts {
      display: grid;
      gap: 8px
    }

    .opt {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 11px;
      background: var(--bg)
    }

    .opt.sel {
      border: 2px solid var(--accent)
    }

    .opt .oh {
      display: flex;
      gap: 8px;
      align-items: baseline
    }

    .opt .rk {
      background: var(--ink);
      color: var(--bg);
      border-radius: 6px;
      padding: 0 6px;
      font-weight: 700;
      font-size: 12px
    }

    .opt .score {
      margin-left: auto;
      font-weight: 700;
      color: var(--accent);
      font-size: 16px
    }

    .opt .parts {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--muted);
      margin: 4px 0
    }

    .why-list {
      margin: 4px 0;
      padding-left: 16px;
      font-size: 12px;
      color: var(--muted)
    }

    .warnl {
      font-size: 12px;
      color: var(--warn);
      margin: 2px 0 6px
    }

    .ringbox {
      text-align: center
    }

    .why {
      background: none;
      border: 1px solid var(--info);
      color: var(--info);
      border-radius: 10px;
      font-size: 10.5px;
      padding: 0 6px;
      cursor: pointer;
      font-weight: 600
    }

    .kpis {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .kpis>div {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      min-width: 140px
    }

    .kpis b {
      display: block;
      font-size: 19px
    }

    .kpis span {
      font-size: 12px;
      color: var(--muted)
    }

    .kpis.col {
      flex-direction: column
    }

    .sheetwrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px
    }

    .sheet {
      width: 100%;
      min-width: 760px;
      height: auto;
      display: block
    }

    textarea.rat {
      width: 100%;
      min-height: 200px;
      font-size: 13px
    }

    .outcome {
      border: 2px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px
    }

    .outcome h2 {
      margin: 0 0 6px;
      color: var(--accent)
    }

    .outcome .dl {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .outcome .sheet {
      min-width: 0
    }

    .job {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      margin: 6px 0;
      cursor: pointer;
      background: var(--bg)
    }

    .job.sel {
      outline: 2px solid var(--accent)
    }

    .job .mt {
      text-align: right;
      min-width: 150px
    }

    .job .mt span {
      display: block
    }

    .hit {
      border-left: 3px solid var(--accent);
      padding: 4px 10px;
      margin: 8px 0;
      background: var(--bg);
      border-radius: 0 6px 6px 0
    }

    .hit p {
      margin: 4px 0
    }

    .row {
      display: flex;
      gap: 8px
    }

    .row input {
      flex: 1
    }

    .catgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px
    }

    details summary {
      cursor: pointer;
      font-size: 12.5px;
      color: var(--info);
      margin-top: 6px
    }

    .hero {
      max-width: 980px
    }

    .hero h1 {
      font-size: 34px;
      margin: 6px 0
    }

    .hero .lead {
      font-size: 16px
    }

    .flowline {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 16px 0
    }

    .fl {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12.5px
    }

    .fl b {
      color: var(--accent);
      margin-right: 5px
    }

    .fl small {
      margin-left: 5px;
      color: var(--warn);
      font-weight: 700
    }

    .legendline {
      margin: 12px 0 18px;
      font-size: 13px
    }

    #chatwrap {
      position: fixed;
      top: 52px;
      right: 0;
      bottom: 0;
      width: 360px;
      background: var(--paper);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .2s;
      z-index: 15
    }

    body.chat-open #chatwrap {
      transform: none
    }

    #chatwrap .ch {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    #chat {
      flex: 1;
      overflow: auto;
      padding: 10px
    }

    .msg {
      padding: 8px 10px;
      border-radius: 10px;
      margin: 6px 0;
      font-size: 13px
    }

    .msg.bot {
      background: var(--bg);
      border: 1px solid var(--line)
    }

    .msg.me {
      background: var(--accent);
      color: #fff;
      margin-left: 30px
    }

    .msg .cite {
      color: var(--info);
      font-size: 11.5px;
      font-weight: 600
    }

    .msg .src {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px
    }

    function openControlCenter(tab) {

      var f = document.getElementById('ccframe'), url = 'control_center.html' + apiParam + '#' + encodeURIComponent(tab || 'Formulas');
      try {
        if (f.getAttribute('src') && f.getAttribute('src').split('#')[0].indexOf('control_center.html') !== -1 && f.contentWindow) {
          f.contentWindow.location.hash = '#' + encodeURIComponent(tab || 'Formulas');

        } else {

    /* ============ API CONFIGURATION ============ */
    function getApiBase() {
      try { const sp = new URLSearchParams(window.location.search); if (sp.get('api')) return sp.get('api').replace(/\/+$/, ''); } catch (e) {}
      if (typeof window !== 'undefined' && window.REFRACTORY_API_BASE) {
        return window.REFRACTORY_API_BASE.replace(/\/+$/, '');
      }
      try {
        const saved = localStorage.getItem('refractory_api_base');
        if (saved) return saved.replace(/\/+$/, '');
      } catch (e) {}

      if (typeof window !== 'undefined' && window.location && window.location.protocol.startsWith('http')) {
        // If frontend is running on dev port 3000

        upd('lcAng', v, hasExt ? `${ea.lower_cone_angle_deg}°` : null, hasExt ? 'Extracted lower cone half-angle' : 'Formula-calculated lower cone half-angle (ext_cone_half_angle)', hasExt ? 'drawing' : 'derived', hasExt ? 0.95 : 0.90);
      }
      if (ea.top_cone_angle_deg != null || ea.calculated_top_cone_angle_deg != null) {
        const hasExt = ea.top_cone_angle_deg != null;
        const v = hasExt ? ea.top_cone_angle_deg : ea.calculated_top_cone_angle_deg;
        upd('halfAng', v, hasExt ? `${ea.top_cone_angle_deg}°` : null, hasExt ? 'Extracted top cone half-angle' : 'Formula-calculated top cone half-angle (ext_cone_half_angle)', hasExt ? 'drawing' : 'derived', hasExt ? 0.95 : 0.90);
      }
      if (ea.taphole_inclination_deg != null || ea.calculated_taphole_inclination_deg != null) {
        const hasExt = ea.taphole_inclination_deg != null;
        const v = hasExt ? ea.taphole_inclination_deg : ea.calculated_taphole_inclination_deg;
        upd('tapIncl', v, hasExt ? `${ea.taphole_inclination_deg}°` : null, hasExt ? 'Extracted taphole inclination angle' : 'Formula-calculated taphole inclination angle', hasExt ? 'drawing' : 'derived', hasExt ? 0.95 : 0.90);
      }
      if (ea.bottom_stirring_angle_deg != null || ea.calculated_bottom_stirring_angle_deg != null) {
        const hasExt = ea.bottom_stirring_angle_deg != null;
        const v = hasExt ? ea.bottom_stirring_angle_deg : ea.calculated_bottom_stirring_angle_deg;
        upd('stirAng', v, hasExt ? `${ea.bottom_stirring_angle_deg}°` : null, hasExt ? 'Extracted bottom MHP/tuyere angular span' : 'Formula-calculated bottom MHP/tuyere angular span', hasExt ? 'drawing' : 'derived', hasExt ? 0.95 : 0.90);
      }
      const md = xmeta.mouth_details || {};
      if (md.mouth_flange_od_mm != null && +md.mouth_flange_od_mm > 0) {
        const hasExt = md.mouth_flange_extension_mm != null && +md.mouth_flange_extension_mm > 10;
        upd('ringOD', +md.mouth_flange_od_mm, hasExt ? `Ø${Math.round(+md.mouth_flange_od_mm)}` : null, hasExt ? 'Extracted extended mouth flange OD' : 'Formula-calculated mouth OD (ringID + 2×lip)', hasExt ? 'drawing' : 'derived', hasExt ? 0.95 : 0.85);
      }
      if (md.mouth_flange_extension_mm != null && +md.mouth_flange_extension_mm > 0) {
        upd('lip', +md.mouth_flange_extension_mm, `Ø${Math.round(+md.mouth_flange_od_mm || 0)} − Ø${Math.round(+md.mouth_inner_dia_mm || 0)}`, 'Radial mouth flange lip extension: (ringOD − ringID) / 2', 'drawing', 0.95);
        upd('ringProf', 'With retaining lip', `Ø${Math.round(+md.mouth_flange_od_mm || 0)} flange`, 'Extended mouth flange ring detected', 'drawing', 0.95);
      }
      if (xmeta.calculated_vs_extracted) {
        Object.entries(xmeta.calculated_vs_extracted).forEach(([k, obj]) => {
          if (S.ext[k] && obj) {
            if (obj.extracted != null && !S.ext[k].rawText) S.ext[k].rawText = String(obj.extracted);
            S.ext[k].backendCalculated = obj.calculated;
            S.ext[k].backendExtracted = obj.extracted;
          }
        });
      }
      const meta = geom.metadata || (data && data.metadata) || {};
      if (meta.file_hash) S.job.drawingHash = meta.file_hash;
      if (meta.drawing_number) S.job.drawingNo = meta.drawing_number;
      if (meta.revision) S.job.drawingRev = meta.revision;
      const vt = String(geom.vessel_type || '').toUpperCase();
      if (vt === 'EAF') S.job.vessel = 'EAF (Electric Arc Furnace)';
      else if (vt === 'LADLE') S.job.vessel = 'Steel Ladle';
      else if (vt === 'RH_DEGASSER') S.job.vessel = 'RH Degasser';
      const op = geom.operating_conditions || {};
      if (op.vessel_capacity_tons) S.job.heat = +op.vessel_capacity_tons;
      if (op.tapping_temperature_c) S.job.tapT = +op.tapping_temperature_c;
      S.extSrc = src;
      INIT.ext = clone(S.ext);
      S.extOk = {};
      S.annAll = false;
      reopenFrom(1);
      const miss = LIN_EXT.filter(([k]) => !src[k]).map(([k]) => S.ext[k].label);
      log('Extraction applied', `${Object.keys(src).length} values from the drawing; not found: ${miss.join(', ') || 'none'}`);
      return { found: Object.keys(src).length, miss, warnings };
    }

    if (typeof document !== 'undefined') {
      document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el); } });
      document.addEventListener('input', e => {
        const el = e.target;
        if (el.dataset && el.dataset.p && el.dataset.p.startsWith('job.')) {
          const p = el.dataset.p; let v = el.value; if (el.type === 'checkbox') v = el.checked; else if (el.type === 'number') v = v === '' ? '' : +v;
          setP(S, p, v);
          if (S.step === 0 && !S.extracting) {
            const ok = !!(S.job.customer && +S.job.heat > 0 && S.job.drawing);
            const gb = document.querySelector('#view .gatebox');
            if (gb) {
              const g = S.gates[0];
              const infoDiv = gb.querySelector('div');
              if (infoDiv) {
                infoDiv.innerHTML = `${g ? `<span class="gate done">✓ Confirmed by Designer · ${g.t}</span>` : `<span class="gate">Not confirmed</span>`} ${!ok ? `<span class="small badt">Customer name, heat size and drawing are required.</span>` : ''}`;
              }
              const btn = gb.querySelector('[data-act="gate"]');
              if (btn) btn.disabled = !ok || !!g;
            }
          }
        }
        const p = el.dataset && el.dataset.p; if (!p || el.type !== 'number') return;
        const box = document.querySelector('[data-live-pic]'); if (!box || !LIVE[box.dataset.livePic]) return;
        if (el.dataset.orig === undefined) el.dataset.orig = String(getP(S, p));
        if (el.value === '' || isNaN(+el.value)) return; setP(S, p, +el.value); clearCache();
        try { box.innerHTML = LIVE[box.dataset.livePic](); } catch (err) { /* keep last picture while typing */ }
      });
      document.addEventListener('change', e => {
        const el = e.target;
        if (el.id === 'sessin' && el.files[0]) { const file = el.files[0]; file.text().then(t => loadSession(t, file.name)); return; }
        if (el.id === 'upl' && el.files[0]) {
          const file = el.files[0];
          LAST_UPLOAD = file;
          S.job.drawing = file.name;
          delete S.extractionError;
          delete S.extractionSummary;
          log('Drawing uploaded', S.job.drawing);
          toast('Processing drawing with backend...', 'ok');
          S.extracting = true;
          render();

          const formData = new FormData();
          formData.append('file', file);
          formData.append('rotate', String(+(S.job.drawRot || 0)));   // turn a lying / upside-down drawing upright first
          if (+(S.job.drawRot || 0)) log('Drawing turned before extraction', `mouth ${({ 90: 'on the right', 180: 'at the bottom', 270: 'on the left' })[+S.job.drawRot]} - turned upright`);

          // We disable navigation during extraction to enforce waiting
          const navLinks = document.querySelectorAll('.sidebar a, .side .st');
          navLinks.forEach(l => l.style.pointerEvents = 'none');

          const apiBaseUrl = getApiBase();
          fetch(`${apiBaseUrl}/api/v1/extraction/process`, { method: 'POST', headers: authHeaders(), body: formData })
            .then(res => {
              S.extracting = false;
              navLinks.forEach(l => l.style.pointerEvents = 'auto');
              if (!res.ok) return res.text().then(err => { throw new Error(err || `HTTP ${res.status}`); });
              return res.json();
            })
            .then(data => {
              // person 1\'s extraction -> step-2 values (see linApplyExtraction): every value found on the drawing is
              // filled in; anything not found is left empty and marked, so no sample value is used silently
              const r = linApplyExtraction(data);
              S.extractionSummary = `${r.found} dimension(s) extracted from drawing.`;
              // one notice (not an error): what was found, and what the user must check in step 2
              toast(r.miss.length || r.warnings.length ? `Extraction done – please check step 2: ${[r.miss.length ? r.miss.length + ' value(s) not found on the drawing' : '', ...r.warnings].filter(Boolean).join('; ')}` : 'Extraction complete. Dimensions updated.', r.miss.length || r.warnings.length ? '' : 'ok');
              render();
            })
            .catch(err => {
              S.extracting = false;
              navLinks.forEach(l => l.style.pointerEvents = 'auto');
              console.error(err);
              S.extractionError = (err.message && err.message.length > 250 ? err.message.slice(0, 250) + '...' : err.message) || 'Network connection failed';
              toast('Backend processing failed: ' + S.extractionError, 'bad');
              render();
            });
          return;
        }
        const p = el.dataset.p; if (!p) return;
        const old = el.dataset.orig !== undefined ? el.dataset.orig : getP(S, p); delete el.dataset.orig; let v = el.value; if (el.type === 'checkbox') v = el.checked; else if (el.type === 'number') v = v === '' ? '' : +v; else if (typeof old === 'number' && v !== '' && !isNaN(+v)) v = +v;
        if (p.startsWith('zones.') && p.endsWith('.h1')) { const i = +p.split('.')[1]; const H = S.zones[S.zones.length - 1].type === 'Mouth' ? mouthPlan().start : XN('H'); v = Math.max(S.zones[i].h0 + 1, Math.min(+v, H)); S.zones[i].h1 = v; if (S.zones[i + 1]) S.zones[i + 1].h0 = v; for (let j = i + 1; j < S.zones.length; j++) { if (S.zones[j].h1 <= S.zones[j].h0) S.zones[j].h1 = Math.min(H, S.zones[j].h0 + 1); if (S.zones[j + 1]) S.zones[j + 1].h0 = S.zones[j].h1; } }
        else setP(S, p, v);
        if (p === 'draft.type') S.draft.name = v;
        if (!p.startsWith('draft.') && !p.startsWith('split.') && !['annAll', 'permX'].includes(p)) { log('Value changed', `${p}: ${old} → ${v}`); reopenFrom(Math.max(1, S.step)); }
        render();
        autoSave();
      });
      if (typeof FX !== 'undefined') {
        FX.load(getApiBase()).then(() => render()).catch(() => {});
      }
      window.addEventListener('message', e => {
        const d = e && e.data;
        if (!d || typeof d !== 'object') return;
        if (d.type === 'refractory-formulas-updated' && typeof FX !== 'undefined') {
          FX.load(getApiBase()).then(() => {
            clearCache();
            log('Formula updated', d.formulaId || 'registry reloaded');
            toast('Formula updated — all step calculations & BOQ recalculated', 'ok');
            render();
          }).catch(() => {});
        } else if (d.type === 'refractory-preset-applied' && d.settings) {
          Object.entries(d.settings).forEach(([k, v]) => { try { setP(S, k, v); } catch (_) {} });
          clearCache();
          log('Preset applied', JSON.stringify(d.settings));
          toast('Saved settings applied', 'ok');
          render();
        }
      });
      updateAuthHeaderUI();
      if (!AUTH.user || !AUTH.token) { renderAuthOverlay('login'); }
      updSess();
      checkServerHealth();
      setInterval(checkServerHealth, 30000);
      loadClientLib().then(() => { if (fillFromClientLib(false)) render(); });
      render();
    }
  </script>
</body>

</html>
